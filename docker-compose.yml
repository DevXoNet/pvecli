version: '3.8'

services:
  pvecli:
    build:
      context: .
      dockerfile: Dockerfile
    image: pvecli:latest
    container_name: pvecli
    volumes:
      # Mount config file
      - ./config.example.yaml:/home/pvecli/.pvecli/config.yaml:ro
      # Or mount entire config directory
      # - ~/.pvecli:/home/pvecli/.pvecli:ro
    environment:
      # Optional: Override config with environment variables
      - PVECLI_API_URL=${PVECLI_API_URL:-}
      - PVECLI_TOKEN_ID=${PVECLI_TOKEN_ID:-}
      - PVECLI_TOKEN_SECRET=${PVECLI_TOKEN_SECRET:-}
    # Override default command
    # command: ["list"]
    # For interactive use
    stdin_open: true
    tty: true
